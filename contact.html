<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Mukta Design</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--------- HEADER --------->
    <header class="header">
        <a href="index.html" class="logo"> Mukta Design </a>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="demo-store.html"> Demo Store </a>
            <a href="source-code.html"> Source Code </a>
            <a href="contact.html"> Contact </a>
        </nav>
    </header>


<section class="contact-section">
  <h1 class="section-title">Get In Touch<span></span></h1>

  <div class="contact-container">

    <div class="contact-info">
      <div class="info-card">
        <div class="icon">✉️</div>
        <div>
          <h3>Email</h3>
          <p>hello.muktadesign@gmail.com</p>
        </div>
      </div>

      <div class="info-card">
        <div class="icon">📞</div>
        <div>
          <h3>WhatsApp</h3>
          <p>+918918848547</p>
        </div>
      </div>

      <div class="info-card">
        <div class="icon">📍</div>
        <div>
          <h3>Location</h3>
          <p> West Bengali ⭐ India</p>
        </div>
      </div>
    </div>

    <form class="contact-form" id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" rows="6" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

  </div>
</section>

<script src="js/script.js"></script>
</body>

</html>
