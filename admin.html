<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin - Publish Card</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        background: #f4f1ea;
        color: #1c3d3a;
    }
    h1 { text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-family: inherit;
    }
    textarea {
        font-family: "Courier New", monospace;
        min-height: 150px;
    }
    button {
        margin-top: 20px;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        background: #1c3d3a;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    #status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        display: none;
        font-weight: bold;
    }
    .success {
        background: #d4f5d4;
        color: #1c3d3a;
        display: block !important;
    }

    .error {
    background: #ffe5e5;
    color: #d00000;
    display: block !important;
}
    
    .loading {
        background: #f5edd4;
        color: #1c3d3a;
        display: block !important;
    }
    small { color: #666; }
</style>
</head>
<body>

<h1>Publish Source Code Card</h1>

<label for="token">GitHub Token</label>
<input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
<small>Used only for this session. Never saved.</small>

<label for="title">Card Title</label>
<input type="text" id="title" placeholder="e.g. Trustpilot Rating Badge">

<label for="filename">File Name</label>
<input type="text" id="filename" placeholder="e.g. TrustpilotCode.txt">
<small>Use letters, numbers, hyphens or underscores. .txt will be added automatically if needed.</small>

<label for="image">Card Image (jpg, png or webp, max 500 kb)</label>
<input type="file" id="image" accept="image/jpeg,image/png,image/webp">

<label for="code">Source Code</label>
<textarea id="code" placeholder="Paste your raw HTML/CSS/JS code here"></textarea>

<button type="button" id="publishBtn" onclick="publishCard()">Publish Card</button>

<div id="status"></div>

<script>

const OWNER = "mukta92";
const REPO = "mukta-design";
const BRANCH = "main";
const CARDS_FILE = "cards.json";

const MAX_IMAGE_BYTES = 500 * 1024;

const IMAGE_TYPES = {
    "image/jpeg": "jpg",
    "image/png": "png",
    "image/webp": "webp"
};


/* =========================
   STATUS MESSAGE
========================= */

function setStatus(msg, type) {

    const el = document.getElementById("status");

    el.textContent = msg;
    el.className = type;
}


/* =========================
   BASE64 HELPERS
========================= */

function bytesToBase64(bytes) {

    let binary = "";
    const chunk = 0x8000;

    for (let i = 0; i < bytes.length; i += chunk) {

        binary += String.fromCharCode.apply(
            null,
            bytes.subarray(i, i + chunk)
        );
    }

    return btoa(binary);
}


function textToBase64(str) {

    return bytesToBase64(
        new TextEncoder().encode(str)
    );
}


function base64ToText(b64) {

    const binary = atob(
        b64.replace(/\n/g, "")
    );

    const bytes = Uint8Array.from(
        binary,
        c => c.charCodeAt(0)
    );

    return new TextDecoder().decode(bytes);
}


async function fileToBase64(file) {

    const buffer = await file.arrayBuffer();

    return bytesToBase64(
        new Uint8Array(buffer)
    );
}


/* =========================
   GITHUB API
========================= */

function apiUrl(path) {

    return `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
}


function authHeaders(token) {

    return {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json"
    };
}


/* =========================
   UPLOAD / UPDATE FILE
========================= */

async function putFile(
    token,
    path,
    contentB64,
    message,
    sha
) {

    const body = {
        message: message,
        content: contentB64,
        branch: BRANCH
    };

    /*
     * SHA is required when updating
     * an existing GitHub file.
     */
    if (sha) {
        body.sha = sha;
    }

    const res = await fetch(
        apiUrl(path),
        {
            method: "PUT",

            headers: Object.assign(
                {
                    "Content-Type": "application/json"
                },
                authHeaders(token)
            ),

            body: JSON.stringify(body)
        }
    );

    const responseText = await res.text();

    let data = {};

    try {

        if (responseText) {
            data = JSON.parse(responseText);
        }

    } catch (e) {

        data = {};
    }

    if (!res.ok) {

        throw new Error(
            data.message ||
            `GitHub error ${res.status} while saving ${path}`
        );
    }

    return data;
}


/* =========================
   READ CARDS.JSON
========================= */

async function readCards(token) {

    const res = await fetch(
        apiUrl(CARDS_FILE) +
        "?ref=" +
        BRANCH,

        {
            headers: authHeaders(token),
            cache: "no-store"
        }
    );

    const responseText = await res.text();

    let data = {};

    try {

        if (responseText) {
            data = JSON.parse(responseText);
        }

    } catch (e) {

        throw new Error(
            "GitHub returned an invalid response while reading cards.json."
        );
    }


    if (!res.ok) {

        throw new Error(
            `Could not read cards.json. GitHub returned ${res.status}: ${
                data.message || "Unknown error"
            }`
        );
    }


    if (!data.sha) {

        throw new Error(
            "GitHub did not provide the SHA for cards.json."
        );
    }


    if (!data.content) {

        throw new Error(
            "GitHub returned cards.json without its content."
        );
    }


    const parsed = JSON.parse(
        base64ToText(data.content) || "[]"
    );


    if (!Array.isArray(parsed)) {

        throw new Error(
            "cards.json must contain a list."
        );
    }


    return {

        cards: parsed,

        sha: data.sha
    };
}


/* =========================
   CHECK IF FILE EXISTS
========================= */

async function fileExists(token, path) {

    const res = await fetch(

        apiUrl(path) +
        "?ref=" +
        BRANCH,

        {
            headers: authHeaders(token),
            cache: "no-store"
        }
    );


    if (res.status === 404) {

        return false;
    }


    if (!res.ok) {

        const responseText = await res.text();

        let data = {};

        try {

            if (responseText) {
                data = JSON.parse(responseText);
            }

        } catch (e) {}


        throw new Error(
            data.message ||
            `Could not check ${path}.`
        );
    }


    return true;
}


/* =========================
   PUBLISH CARD
========================= */

async function publishCard() {

    const token =
        document.getElementById("token").value.trim();

    const title =
        document.getElementById("title").value.trim();

    const filenameInput =
        document.getElementById("filename").value.trim();

    const code =
        document.getElementById("code").value.trim();

    const file =
        document.getElementById("image").files[0];

    const btn =
        document.getElementById("publishBtn");


    /* =========================
       BASIC VALIDATION
    ========================= */

    if (
        !token ||
        !title ||
        !filenameInput ||
        !code ||
        !file
    ) {

        setStatus(
            "Please fill in Token, Title, File Name, Image and Code.",
            "error"
        );

        return;
    }


    /* =========================
       FILE NAME
    ========================= */

    let filename = filenameInput;


    if (
        !filename
            .toLowerCase()
            .endsWith(".txt")
    ) {

        filename += ".txt";
    }


    if (
        !/^[A-Za-z0-9_-]+\.txt$/i.test(filename)
    ) {

        setStatus(
            "Invalid file name. Use only letters, numbers, hyphens and underscores.",
            "error"
        );

        return;
    }


    /* =========================
       IMAGE TYPE
    ========================= */

    const ext = IMAGE_TYPES[file.type];


    if (!ext) {

        setStatus(
            "Image must be jpg, png or webp.",
            "error"
        );

        return;
    }


    /* =========================
       IMAGE SIZE
    ========================= */

    if (file.size > MAX_IMAGE_BYTES) {

        setStatus(
            "Image is too large. Maximum is 500 kb.",
            "error"
        );

        return;
    }


    /* =========================
       DISABLE BUTTON
    ========================= */

    btn.disabled = true;


    setStatus(
        "Publishing... please wait.",
        "loading"
    );


    try {

        /* =========================
           GENERATE CARD ID
        ========================= */

        const id =
            "c" +
            Date.now().toString(36);


        const imagePath =
            `images/${id}.${ext}`;


        const snippetPath =
            `snippets/${filename}`;


        /* =========================
           CHECK DUPLICATE SNIPPET
        ========================= */

        const snippetAlreadyExists =
            await fileExists(
                token,
                snippetPath
            );


        if (snippetAlreadyExists) {

            throw new Error(
                `The file "${filename}" already exists. Please choose a different file name.`
            );
        }


        /* =========================
           UPLOAD IMAGE
        ========================= */

        setStatus(
            "Uploading image...",
            "loading"
        );


        await putFile(

            token,

            imagePath,

            await fileToBase64(file),

            `Add image: ${title}`
        );


        /* =========================
           UPLOAD SNIPPET
        ========================= */

        setStatus(
            "Uploading source code...",
            "loading"
        );


        await putFile(

            token,

            snippetPath,

            textToBase64(code),

            `Add snippet: ${title}`
        );


        /* =========================
           READ LATEST CARDS.JSON
        ========================= */

        setStatus(
            "Updating cards.json...",
            "loading"
        );


        const current =
            await readCards(token);


        /* =========================
           ADD NEW CARD
        ========================= */

        current.cards.unshift({

            id: id,

            title: title,

            image: imagePath,

            snippet: snippetPath
        });


        /* =========================
           UPDATE CARDS.JSON
        ========================= */

        await putFile(

            token,

            CARDS_FILE,

            textToBase64(

                JSON.stringify(
                    current.cards,
                    null,
                    2
                ) + "\n"

            ),

            `Add card: ${title}`,

            current.sha
        );


        /* =========================
           SUCCESS
        ========================= */

        setStatus(

            `Published successfully! Code saved as ${filename}. Live in about 30-60 seconds.`,

            "success"
        );


        /* =========================
           CLEAR FORM
        ========================= */

        document.getElementById(
            "title"
        ).value = "";


        document.getElementById(
            "filename"
        ).value = "";


        document.getElementById(
            "code"
        ).value = "";


        document.getElementById(
            "image"
        ).value = "";


    } catch (err) {


        /* =========================
           ERROR
        ========================= */

        setStatus(

            "Error: " +
            err.message,

            "error"
        );


    } finally {


        /* =========================
           ENABLE BUTTON
        ========================= */

        btn.disabled = false;
    }
}

</script>

    
</body>
</html>
