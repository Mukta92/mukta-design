<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin - Publish Card</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        background: #f4f1ea;
        color: #1c3d3a;
    }
    h1 { text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-family: inherit;
    }
    textarea { font-family: "Courier New", monospace; min-height: 150px; }
    button {
        margin-top: 20px;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        background: #1c3d3a;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        display: none;
        font-weight: bold;
    }
    .success { background: #d4f5d4; color: #1c3d3a; display: block !important; }
    .error { background: #f5d4d4; color: #7a1c1c; display: block !important; }
    .loading { background: #f5edd4; color: #1c3d3a; display: block !important; }
    small { color: #666; }
</style>
</head>
<body>

<h1>Publish Source Code Card</h1>

<label for="token">GitHub Token</label>
<input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
<small>Used only for this session. Never saved.</small>

<label for="title">Card Title</label>
<input type="text" id="title" placeholder="e.g. Trustpilot Rating Badge">

<label for="image">Card Image (jpg, png or webp, max 2 MB)</label>
<input type="file" id="image" accept="image/jpeg,image/png,image/webp">

<label for="code">Source Code</label>
<textarea id="code" placeholder="Paste your raw HTML/CSS/JS code here"></textarea>

<button type="button" id="publishBtn" onclick="publishCard()">Publish Card</button>

<div id="status"></div>

<script>

const OWNER = "mukta92";
const REPO = "mukta-design";
const BRANCH = "main";
const CARDS_FILE = "cards.json";
const MAX_IMAGE_BYTES = 2 * 1024 * 1024;
const IMAGE_TYPES = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };

function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
}

function bytesToBase64(bytes) {
    let binary = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
}

function textToBase64(str) {
    return bytesToBase64(new TextEncoder().encode(str));
}

function base64ToText(b64) {
    const binary = atob(b64.replace(/\n/g, ""));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
}

async function fileToBase64(file) {
    const buffer = await file.arrayBuffer();
    return bytesToBase64(new Uint8Array(buffer));
}

function apiUrl(path) {
    return `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
}

function authHeaders(token) {
    return {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json"
    };
}

async function putFile(token, path, contentB64, message, sha) {
    const body = { message: message, content: contentB64, branch: BRANCH };
    if (sha) body.sha = sha;

    const res = await fetch(apiUrl(path), {
        method: "PUT",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders(token)),
        body: JSON.stringify(body)
    });

    if (!res.ok) {
        let msg = "Failed to upload " + path;
        try { msg = (await res.json()).message || msg; } catch (e) {}
        throw new Error(msg);
    }
}

async function readCards(token) {
    const res = await fetch(apiUrl(CARDS_FILE) + "?ref=" + BRANCH, {
        headers: authHeaders(token),
        cache: "no-store"
    });

    if (res.status === 404) return { cards: [], sha: null };
    if (!res.ok) throw new Error("Could not read cards.json. Check your token and repo details.");

    const data = await res.json();
    const parsed = JSON.parse(base64ToText(data.content) || "[]");
    if (!Array.isArray(parsed)) throw new Error("cards.json must contain a list.");
    return { cards: parsed, sha: data.sha };
}

async function publishCard() {
    const token = document.getElementById('token').value.trim();
    const title = document.getElementById('title').value.trim();
    const code = document.getElementById('code').value.trim();
    const file = document.getElementById('image').files[0];
    const btn = document.getElementById('publishBtn');

    if (!token || !title || !code || !file) {
        setStatus("Please fill in Token, Title, Image and Code.", "error");
        return;
    }

    const ext = IMAGE_TYPES[file.type];
    if (!ext) {
        setStatus("Image must be jpg, png or webp.", "error");
        return;
    }
    if (file.size > MAX_IMAGE_BYTES) {
        setStatus("Image is too large. Maximum is 2 MB.", "error");
        return;
    }

    btn.disabled = true;
    setStatus("Publishing... please wait.", "loading");

    try {
        const id = "c" + Date.now().toString(36);
        const imagePath = `images/${id}.${ext}`;
const snippetPath = `snippets/${id}.txt`;
        
        await putFile(token, imagePath, await fileToBase64(file), `Add image: ${title}`);
        await putFile(token, snippetPath, textToBase64(code), `Add snippet: ${title}`);

        // Read cards.json last so nothing is overwritten by an older copy
        const current = await readCards(token);
        current.cards.unshift({
            id: id,
            title: title,
            image: imagePath,
            snippet: snippetPath
        });

        await putFile(
            token,
            CARDS_FILE,
            textToBase64(JSON.stringify(current.cards, null, 2) + "\n"),
            `Add card: ${title}`,
            current.sha
        );

        setStatus(`Published as ${id}! Live in about 30-60 seconds.`, "success");
        document.getElementById('title').value = '';
        document.getElementById('code').value = '';
        document.getElementById('image').value = '';

    } catch (err) {
        setStatus("Error: " + err.message, "error");
    } finally {
        btn.disabled = false;
    }
}

</script>

</body>
</html>
