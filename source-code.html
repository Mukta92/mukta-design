    <div class="code-card">

        <h2>
            Trustpilot Rating Badge
        </h2>

        <p>
            Custom Trustpilot-style rating badge
            for a Shopify product page.
        </p>

        <pre id="code1">&lt;div class="trustpilot-rating"&gt;
    &lt;strong&gt;Excellent&lt;/strong&gt;
    &lt;span&gt;★★★★★&lt;/span&gt;
    &lt;span&gt;4.8 out of 5&lt;/span&gt;
&lt;/div&gt;</pre>


        <button onclick="copyCode('code1')">
            Copy Code
        </button>

    </div>

</main>


<script>

function copyCode(id) {

    const code = document
        .getElementById(id)
        .innerText;

    navigator.clipboard.writeText(code);

    alert("Code copied!");

}

</script>
