<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Code | Mukta Design</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!--------- HEADER --------->
    <header class="header">
        <a href="index.html" class="logo"> Mukta Design </a>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="demo-store.html"> Demo Store </a>
            <a href="source-code.html"> Source Code </a>
            <a href="contact.html"> Contact </a>
        </nav>
    </header>

    <main class="source-code-page">
        <div class="source-code-container">

            <h1>Source <span class="highlight">Code</span></h1>

            <div class="code-grid" id="codeGrid">
                <p class="grid-message">Loading...</p>
            </div>

        </div>
    </main>

    <script>
async function loadCards() {
    const grid = document.getElementById('codeGrid');

    try {
        const response = await fetch(
            'https://api.github.com/repos/Mukta92/mukta-design/contents/snippets',
            { cache: 'no-store' }
        );

        if (!response.ok) {
            throw new Error('Could not load snippets');
        }

        const files = await response.json();

        grid.innerHTML = '';

        files
            .filter(file => file.type === 'file' && file.name.endsWith('.txt'))
            .forEach(file => {

                const id = file.name.replace('.txt', '');

                const link = document.createElement('a');
                link.className = 'code-card-link';
                link.href = 'code-detail.html?id=' + encodeURIComponent(id);

                const box = document.createElement('div');
                box.className = 'code-card';

                const img = document.createElement('img');
                img.className = 'card-image';
                img.src = 'images/' + id + '.png';
                img.alt = id;
                img.loading = 'lazy';

                const btn = document.createElement('span');
                btn.className = 'get-code-btn';
                btn.textContent = 'Get Code';

                box.appendChild(img);
                box.appendChild(btn);
                link.appendChild(box);
                grid.appendChild(link);
            });

    } catch (error) {
        console.error(error);
        grid.innerHTML = '<p class="grid-message">Could not load cards.</p>';
    }
}

loadCards();
        
    </script>

</body>
</html>
