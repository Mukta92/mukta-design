<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Code | Mukta Design</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!--------- HEADER --------->
    <header class="header">
        <a href="index.html" class="logo"> Mukta Design </a>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="demo-store.html"> Demo Store </a>
            <a href="source-code.html"> Source Code </a>
            <a href="contact.html"> Contact </a>
        </nav>
    </header>

    <main class="source-code-page">
        <div class="source-code-container">

            <h1>Source <span class="highlight">Code</span></h1>

            <div class="code-grid" id="codeGrid">
                <p class="grid-message">Loading...</p>
            </div>

        </div>
    </main>

    <script>
    async function loadCards() {
        const grid = document.getElementById('codeGrid');

        try {
            const res = await fetch('cards.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('Could not load cards.');
            const cards = await res.json();

            grid.textContent = '';

            if (!Array.isArray(cards) || cards.length === 0) {
                const p = document.createElement('p');
                p.className = 'grid-message';
                p.textContent = 'No cards yet.';
                grid.appendChild(p);
                return;
            }

            cards.forEach(function (card) {
                if (!card || !/^[a-z0-9-]+$/.test(card.id || '')) return;
                if (typeof card.image !== 'string' || card.image.indexOf('images/') !== 0) return;

                const link = document.createElement('a');
                link.className = 'code-card-link';
                link.href = 'code-detail.html?id=' + encodeURIComponent(card.id);

                const box = document.createElement('div');
                box.className = 'code-card';

                const img = document.createElement('img');
                img.className = 'card-image';
                img.src = card.image;
                img.alt = card.title || 'Source code preview';
                img.loading = 'lazy';

                const btn = document.createElement('span');
                btn.className = 'get-code-btn';
                btn.textContent = 'Get Code';

                box.appendChild(img);
                box.appendChild(btn);
                link.appendChild(box);
                grid.appendChild(link);
            });

        } catch (err) {
            grid.textContent = '';
            const p = document.createElement('p');
            p.className = 'grid-message';
            p.textContent = 'Could not load cards. Please try again.';
            grid.appendChild(p);
        }
    }

    loadCards();
    </script>

</body>
</html>
