<style>
  :root {
    --teal: #02343F;
    --cream: #F0EDCC;
    --white: #ffffff;
    --bg: var(--cream);
    --ink: var(--teal);
    --accent: var(--teal);
    --sky: #ffffff;
    --glow: rgba(255, 255, 255, 0.85);
    --circle: min(480px, 80vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background-color: var(--cream);
    background-image: radial-gradient(ellipse 55% 65% at 78% 55%, #fbfaea 0%, rgba(251, 250, 234, 0) 70%);
    background-attachment: fixed;
    color: var(--ink);
    overflow-x: hidden;
  }

  .header {
    position: relative; z-index: 2;
    margin: 0 auto;
    padding: 26px 6vw 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px 32px; flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 800; letter-spacing: -0.01em;
    color: var(--teal); text-decoration: none;
  }
  .navigation { display: flex; gap: 28px; flex-wrap: wrap; }
  .navigation a {
    font-size: 14px; font-weight: 500;
    color: var(--teal); text-decoration: none;
    padding: 6px 0; border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  

  .hero {
    position: relative;
    min-height: calc(100vh - 70px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
    padding: 48px 6vw 48px 6vw;
    max-width: 1300px;
    margin: 0 auto;
  }

  /* soft orange glow behind the portrait */
  .hero::before {
    content: "";
    position: absolute;
    right: -8vw; top: 50%;
    width: 60vw; height: 60vw;
    max-width: 800px; max-height: 800px;
    transform: translateY(-50%);
    background: radial-gradient(circle, var(--glow) 0%, rgba(255,255,255,0.35) 45%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .text { position: relative; z-index: 1; max-width: 460px; }
  .hello { font-size: 13px; font-weight: 500; }
  .name { font-size: 16px; font-weight: 600; color: var(--accent); margin-top: 6px; }
  h1 {
    font-size: clamp(38px, 5vw, 52px);
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 22px 0 34px;
  }
  .about { font-size: 13px; line-height: 1.6; max-width: 440px; }

  .actions { display: flex; gap: 12px; margin-top: 78px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    height: 32px; padding: 0 26px;
    border-radius: 6px;
    font: 600 12.5px "Inter", sans-serif;
    text-decoration: none; cursor: pointer;
    transition: transform .15s ease, background-color .15s ease;
  }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-primary { background: var(--teal); color: var(--white); border: 1px solid var(--teal); }
  .btn-primary:hover { background: #03485a; }
  .btn-outline { background: transparent; color: var(--teal); border: 1px solid var(--teal); padding: 0 10px; height: 32px; }
  .btn-outline:hover { background: rgba(2,52,63,0.08); }

  /* portrait: simple circle, accent border, white gap, image fitted inside */
  .portrait {
    position: relative; z-index: 1;
    justify-self: center;
    width: var(--circle);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 6px solid var(--accent);
    padding: 14px;
    background: var(--white);
    box-shadow: 0 24px 60px rgba(2, 52, 63, 0.22);
  }
  .portrait img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;          /* image always fills the circle without stretching */
    object-position: center top; /* keeps the face in view */
    display: block;
    background: var(--sky);
  }

.navigation a {
  padding: 6px 0;
}
.navigation a:hover,
.navigation a[aria-current="page"] {
  border-bottom-color: #02343F;
}

  
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding-top: 32px; text-align: left; }
    .actions { margin-top: 40px; }
    .portrait { order: -1; }
    .text { max-width: none; }
  }
</style>
    <link rel="stylesheet" href="css/style.css">
