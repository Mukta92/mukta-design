<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demo Store | Mukta Design</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #00203f;
        }

        .header {
            background: #00203f;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #d6ed17;
        }

        .container {
            max-width: 1000px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .highlight {
            color: #d6ed17;
            background: #00203f;
            padding: 0 8px;
        }

        .container p {
            color: #666;
            font-size: 18px;
        }

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

        }

    </style>

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        Mukta Design
    </a>

    <nav>

        <a href="index.html">Home</a>

        <a href="demo-store.html">
            Demo Store
        </a>

        <a href="source-code.html">
            Source Code
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<main class="container">

    <h1>
        Demo <span class="highlight">Store</span>
    </h1>

    <p>
        Explore live Shopify store design demos
        created by Mukta Design.
    </p>

</main>

</body>

</html>
