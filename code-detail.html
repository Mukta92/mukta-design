<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Code Detail | Mukta Design</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="announcement">
  <a href="https://www.youtube.com/@muktadesign" target="_blank" rel="noopener">
    <svg class="yt-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8z"/>
      <path fill="#FFFFFF" d="M9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/>
    </svg>
    <span class="w" id="wave">Check Out My YouTube Channel 🚀</span>
  </a>
</div>
    
    <!--------- HEADER --------->
    <header class="header">
        <a href="index.html" class="logo"> Mukta Design </a>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="demo-store.html"> Demo Store </a>
            <a href="source-code.html"> Source Code </a>
            <a href="contact.html"> Contact </a>
        </nav>
    </header>

    <main class="source-code-page">
        <div class="source-code-container detail-container">

            <a href="source-code.html" class="back-button">&larr; Back to Source Code</a>

            <div id="detailContent">
                <p>Loading...</p>
            </div>

        </div>
    </main>

    <script>
    function showMessage(text) {
        const container = document.getElementById('detailContent');
        container.textContent = '';
        const p = document.createElement('p');
        p.textContent = text;
        container.appendChild(p);
    }

    async function loadCard() {
        const params = new URLSearchParams(window.location.search);
        const cardId = params.get('id') || '';

        if (!/^[a-zA-Z0-9_-]+$/.test(cardId)) {
            showMessage('No card specified.');
            return;
        }

        try {
            const res = await fetch('cards.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('cards.json failed');
            const cards = await res.json();

            const card = cards.find(function (c) { return c.id === cardId; });
            if (!card || typeof card.snippet !== 'string' || card.snippet.indexOf('snippets/') !== 0) {
                showMessage('Card not found.');
                return;
            }

            const codeRes = await fetch(card.snippet, { cache: 'no-store' });
            if (!codeRes.ok) throw new Error('snippet failed');
            const codeText = await codeRes.text();

            const title = card.title || 'Source Code';
            document.title = title + ' | Mukta Design';

            const container = document.getElementById('detailContent');
            container.textContent = '';

            const h1 = document.createElement('h1');
            h1.textContent = title;

            const pre = document.createElement('pre');
            pre.className = 'detail-pre';
            pre.textContent = codeText;

            const group = document.createElement('div');
            group.className = 'button-group';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.type = 'button';
            copyBtn.textContent = 'Copy Code';
            copyBtn.addEventListener('click', async function () {
                try {
                    await navigator.clipboard.writeText(codeText);
                    copyBtn.textContent = 'Copied!';
                } catch (e) {
                    copyBtn.textContent = 'Copy failed';
                }
                setTimeout(function () { copyBtn.textContent = 'Copy Code'; }, 1500);
            });

            const back = document.createElement('a');
            back.className = 'db-back-button';
            back.href = 'source-code.html';
            back.innerHTML = '&larr; Back to Source Code';

            group.appendChild(copyBtn);
            group.appendChild(back);

            container.appendChild(h1);
            container.appendChild(pre);
            container.appendChild(group);

        } catch (err) {
            showMessage('Could not load this card. Please try again.');
        }
    }

    loadCard();
    </script>

    <footer class="footer">
  <p>© 2026 Mukta Design. All rights reserved.</p>
</footer>
    
</body>
</html>
